services:
  mock-server:
    build: .
    command: uvicorn mock_server.api:app --host 0.0.0.0 --port 8000
    environment:
      MOCK_HEALTHY: "true"
    ports:
      - "8000:8000"

  orchestrator:
    build: .
    depends_on:
      - mock-server
    command: python -m src.main --repo example/service --commit local-demo
    environment:
      TELEMETRY_URL: http://mock-server:8000/metrics
      ROLLBACK_ENABLED: "false"

